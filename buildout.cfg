[buildout]

package-name = uwosh.snippets
package-extras = [test]
versions = versions

parts +=
    test
    omelette
develop = .

[versions]
plone.app.testing=5.0.8

[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}

[instance]
eggs =
    uwosh.snippets [test]

[test]
recipe = zc.recipe.testrunner
eggs = ${instance:eggs}
defaults = ['-s', 'uwosh.snippets', '--auto-color', '--auto-progress']